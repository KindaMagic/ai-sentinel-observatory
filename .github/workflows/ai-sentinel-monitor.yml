name: AI Sentinel public-source monitor

on:
  schedule:
    - cron: "19 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/monitor.py"
      - "tests/test_monitor.py"
      - "tests/test_critical_register.py"
      - "index.html"
      - "incidents.json"
      - "critical-incidents.json"
      - "CRITICAL_REGISTER.md"
      - "METHODOLOGY.md"
      - "human-judgement.svg"
      - "sentinel-threshold.svg"
      - ".github/workflows/ai-sentinel-monitor.yml"

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-sentinel-monitor
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Run offline safety checks
        run: python3 -m unittest discover -s tests -v
      - name: Check primary publisher feeds and write JSON
        run: python3 scripts/monitor.py
      - name: Publish dated public screening record
        run: |
          git config user.name "ai-sentinel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.json source-inbox.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AI Sentinel automated public evidence watch"
            git push
          fi

      - name: Assemble public site snapshot
        run: |
          mkdir -p .site
          cp index.html incidents.json critical-incidents.json watch.json METHODOLOGY.md CRITICAL_REGISTER.md human-judgement.svg sentinel-threshold.svg .site/
          printf '' > .site/.nojekyll
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Wait for uploaded site artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" -gt 0 ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::Uploaded github-pages artifact is not visible after 30 seconds"
          exit 1
      - name: Deploy refreshed site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
