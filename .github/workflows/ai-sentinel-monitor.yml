name: AI Sentinel public-source monitor

on:
  schedule:
    - cron: "19 2,8,14,20 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/monitor.py"
      - "tests/test_monitor.py"
      - ".github/workflows/ai-sentinel-monitor.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-sentinel-monitor
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run offline safety checks
        run: python3 -m unittest discover -s tests -v
      - name: Check primary publisher feeds and write JSON
        run: python3 scripts/monitor.py
      - name: Publish dated public screening record
        run: |
          git config user.name "ai-sentinel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add watch.json
          if ! git diff --cached --quiet; then
            git commit -m "Update AI Sentinel automated public evidence watch"
            git push
          fi

      - name: Assemble public site snapshot
        run: |
          mkdir -p .site
          cp index.html incidents.json watch.json METHODOLOGY.md .site/
          printf '' > .site/.nojekyll
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site
      - name: Deploy refreshed site to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
